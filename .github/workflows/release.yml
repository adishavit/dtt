name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Build DTT plugin for Linux
  build-linux:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-18 llvm-18-dev libclang-18-dev cmake libz3-dev

    - name: Configure
      run: |
        cmake -B build \
          -DCMAKE_C_COMPILER=clang-18 \
          -DCMAKE_CXX_COMPILER=clang++-18 \
          -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Test
      run: ctest --test-dir build -LE xfail --output-on-failure

    - name: Package
      run: |
        mkdir -p artifacts
        cp build/libDTTPlugin.so artifacts/libDTTPlugin-linux.so

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dtt-plugin-linux
        path: artifacts/libDTTPlugin-linux.so

  # Build DTT plugin for Windows using vcpkg
  build-windows:
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
    steps:
    - uses: actions/checkout@v4

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: '01f602195983451bc83e72f4214af2cbc495aa94'  # 2024.05.24

    - name: Install dependencies via vcpkg
      run: |
        vcpkg install llvm[clang,tools] z3 --triplet x64-windows

    - name: Configure
      run: |
        cmake -B build `
          -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" `
          -DCMAKE_BUILD_TYPE=Release `
          -G "Visual Studio 17 2022" -A x64

    - name: Build
      run: cmake --build build --config Release

    - name: Test
      run: ctest --test-dir build -C Release -LE xfail --output-on-failure

    - name: Package
      run: |
        New-Item -ItemType Directory -Force -Path artifacts
        Copy-Item build/Release/DTTPlugin.dll artifacts/DTTPlugin-win64.dll

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dtt-plugin-windows
        path: artifacts/DTTPlugin-win64.dll

  # Build DTT plugin for macOS (Intel and Apple Silicon)
  build-macos:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install llvm@18 cmake z3

    - name: Configure
      run: |
        cmake -B build \
          -DCMAKE_C_COMPILER=$(brew --prefix llvm@18)/bin/clang \
          -DCMAKE_CXX_COMPILER=$(brew --prefix llvm@18)/bin/clang++ \
          -DLLVM_DIR=$(brew --prefix llvm@18)/lib/cmake/llvm \
          -DClang_DIR=$(brew --prefix llvm@18)/lib/cmake/clang \
          -DZ3_INCLUDE_DIRS=$(brew --prefix z3)/include \
          -DZ3_LIBRARIES=$(brew --prefix z3)/lib/libz3.dylib \
          -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Test
      run: ctest --test-dir build -LE xfail --output-on-failure

    - name: Package
      run: |
        mkdir -p artifacts
        cp build/libDTTPlugin.dylib artifacts/libDTTPlugin-darwin.dylib

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dtt-plugin-macos
        path: artifacts/libDTTPlugin-darwin.dylib

  # Build VS Code extension
  build-vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ide-plugins/vscode-dtt
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Compile
      run: npm run compile

    - name: Package extension
      run: npx vsce package --no-dependencies

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: vscode-extension
        path: ide-plugins/vscode-dtt/*.vsix

  # Create GitHub Release with all artifacts
  release:
    needs: [build-linux, build-windows, build-macos, build-vscode]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-artifacts

    - name: Prepare release files
      run: |
        mkdir -p release
        cp release-artifacts/dtt-plugin-linux/libDTTPlugin-linux.so release/
        cp release-artifacts/dtt-plugin-windows/DTTPlugin-win64.dll release/
        cp release-artifacts/dtt-plugin-macos/libDTTPlugin-darwin.dylib release/
        cp release-artifacts/vscode-extension/*.vsix release/
        ls -la release/

    - name: Get version from tag
      id: version
      run: |
        TAG="${{ github.ref_name }}"
        if [ -z "$TAG" ] || [ "$TAG" = "refs/heads/main" ]; then
          TAG="${{ github.event.inputs.tag }}"
        fi
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "version=${TAG#v}" >> $GITHUB_OUTPUT

    - name: Generate release notes
      id: notes
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        cat > release-notes.md << 'NOTES'
        ## Installation

        ### VS Code Extension
        1. Download `dtt-${{ steps.version.outputs.version }}.vsix`
        2. Run: `code --install-extension dtt-${{ steps.version.outputs.version }}.vsix`
        3. Open a C++ file - the extension will auto-download remaining dependencies

        ### Manual Plugin Installation
        Download the plugin for your platform:
        - **Linux**: `libDTTPlugin-linux.so`
        - **macOS**: `libDTTPlugin-darwin.dylib`
        - **Windows**: `DTTPlugin-win64.dll`

        Run with:
        ```bash
        clang++ -fplugin=./libDTTPlugin.so -std=c++20 -fsyntax-only your_code.cpp
        ```

        ## Checksums
        ```
        NOTES
        cd release
        sha256sum * >> ../release-notes.md
        echo '```' >> ../release-notes.md

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: DTT ${{ steps.version.outputs.tag }}
        body_path: release-notes.md
        draft: false
        prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
        files: |
          release/libDTTPlugin-linux.so
          release/DTTPlugin-win64.dll
          release/libDTTPlugin-darwin.dylib
          release/*.vsix
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
