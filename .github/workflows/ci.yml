name: CI

on:
  schedule:
    # Daily at 00:00 UTC (Linux)
    - cron: '0 0 * * *'
    # Monthly on 1st at 01:00 UTC (macOS)
    - cron: '0 1 1 * *'
  workflow_dispatch:
    inputs:
      macos:
        description: Also run macOS (uses additional runner minutes)
        type: boolean
        default: false

jobs:
  build-linux:
    # Run daily or on manual dispatch
    if: github.event.schedule == '0 0 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-18 llvm-18-dev libclang-18-dev cmake libz3-dev
    
    - name: Configure
      run: |
        cmake -B build \
          -DCMAKE_C_COMPILER=clang-18 \
          -DCMAKE_CXX_COMPILER=clang++-18 \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
    
    - name: Build
      run: |
        clang++-18 --version
        llvm-config-18 --version --libfiles --link-shared
        dpkg-query -W libllvm18 llvm-18-dev libclang-18-dev
        dpkg -V libllvm18 llvm-18-dev
        nm -D -C /usr/lib/llvm-18/lib/libLLVM.so.1 | grep -E 'SmallVectorBase.*(set_allocation_range|grow_pod)' || true
        cmake --build build --verbose
    
    - name: Test
      run: ctest --test-dir build -LE xfail --output-on-failure

    - name: Test (xfail - known gaps, informational)
      run: ctest --test-dir build -L xfail --output-on-failure
      continue-on-error: true

    - name: Upload compile_commands.json
      uses: actions/upload-artifact@v4
      with:
        name: compile-commands
        path: build/compile_commands.json

  build-macos:
    # Run monthly or when explicitly requested on manual dispatch
    if: github.event.schedule == '0 1 1 * *' || (github.event_name == 'workflow_dispatch' && inputs.macos)
    runs-on: macos-14

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install llvm@18 cmake z3

    - name: Configure
      run: |
        cmake -B build \
          -DCMAKE_C_COMPILER=$(brew --prefix llvm@18)/bin/clang \
          -DCMAKE_CXX_COMPILER=$(brew --prefix llvm@18)/bin/clang++ \
          -DLLVM_DIR=$(brew --prefix llvm@18)/lib/cmake/llvm \
          -DClang_DIR=$(brew --prefix llvm@18)/lib/cmake/clang \
          -DZ3_INCLUDE_DIRS=$(brew --prefix z3)/include \
          -DZ3_LIBRARIES=$(brew --prefix z3)/lib/libz3.dylib

    - name: Build
      run: cmake --build build

    - name: Test
      run: ctest --test-dir build -LE xfail --output-on-failure

    - name: Test (xfail - known gaps, informational)
      run: ctest --test-dir build -L xfail --output-on-failure
      continue-on-error: true

  # Windows CI is not currently supported because:
  # - The official LLVM Windows installer doesn't include CMake development files
  #   (LLVMConfig.cmake, ClangConfig.cmake) needed to build Clang plugins
  # - Building LLVM from source takes too long for CI
  #
  # To build DTT on Windows locally, you would need to:
  # 1. Build LLVM from source with: -DLLVM_ENABLE_PROJECTS=clang -DLLVM_INSTALL_UTILS=ON
  # 2. Or use vcpkg: vcpkg install llvm[clang,tools]
  #
  # The CMakeLists.txt includes Windows-specific settings for when this becomes feasible.
